paths:
  /api/health:
    get:
      operationId: health
      summary: Health check
      description: Returns the current ChatCockpit control-plane health information.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/setup/status:
    get:
      operationId: getSetupStatus
      summary: Get first-run setup status
      description: Returns public-safe first-run setup readiness without exposing bearer tokens, local filesystem paths, or private deployment details.
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
  /api/gpt/config:
    get:
      operationId: getGptConfig
      summary: Get Custom GPT Actions compatibility configuration
      description: Returns compatibility metadata for the legacy Custom GPT Actions / OpenAPI Schema workflow. New ChatGPT connections should prefer the MCP integration status surface.
      security:
        - bearerAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          description: Compatibility instructions locale. Defaults to zh-CN for existing clients.
          schema:
            type: string
            enum: [zh-CN, en-US]
      responses:
        "200":
          description: GPT compatibility config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GptConfigResponse'
  /api/integrations/status:
    get:
      operationId: getIntegrationStatus
      summary: Get current ChatCockpit integration status
      description: Returns Local/Public Cockpit and API entrypoints, ChatGPT MCP OAuth readiness and aggregate authorization counts, MCP tool catalog count, and machine API configuration state. Secret values and client identifiers are never returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStatusResponse'
  /api/integrations/oauth/grants:
    get:
      operationId: listOAuthAuthorizationGrants
      summary: List Owner-visible OAuth authorization grants
      description: Returns public-safe authorization-grant metadata for the authenticated Web Owner. Token values, token hashes, redirect URIs, authorization requests and raw OAuth secrets are never returned. This management surface is not available to machine bearer or Remote MCP OAuth identities.
      security:
        - operatorSession: []
      responses:
        "200":
          description: OAuth authorization grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationGrantsResponse'
        "401":
          description: Web Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/integrations/oauth/grants/{grantId}/revoke:
    post:
      operationId: revokeOAuthAuthorizationGrant
      summary: Revoke one OAuth authorization grant
      description: Revokes one Owner-approved authorization and its access/refresh token family. Requires an authenticated Web Owner session plus the session-bound CSRF header. Other grants and Web Owner sessions are unaffected.
      security:
        - operatorSession: []
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
        - name: x-chatcockpit-csrf
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked OAuth authorization grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationGrantMutationResponse'
        "400":
          description: Invalid grant id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "401":
          description: Web Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Authorization grant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/activities:
    get:
      operationId: listOperationalActivities
      summary: List Owner-visible operational activities
      description: Returns an Owner-only unified read model for agent sessions and standalone jobs. Project/workspace/task context is optional, so host-scoped work remains observable. Raw commands, private paths, job instructions and provider payloads are excluded; this endpoint does not execute controls.
      security:
        - operatorSession: []
      responses:
        "200":
          description: Operational activity snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActivityListResponse'
        "401":
          description: Web Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/activities/{activityId}/events:
    get:
      operationId: getOperationalActivityTimeline
      summary: Read one Owner-visible operational activity timeline
      description: Returns up to 100 recent normalized public-safe runtime and Job control events for one Activity. Raw runtime methods, commands, private paths, job instructions, process output, credentials and Governance records are excluded.
      security:
        - operatorSession: []
      parameters:
        - name: activityId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Public-safe operational activity timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalActivityTimelineResponse'
        "401":
          description: Web Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Operational activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/activities/stream:
    get:
      operationId: streamOperationalActivities
      summary: Stream Owner-visible operational activity updates
      description: Owner-only SSE for public-safe Activity updates. Emits activity.snapshot, normalized activity.event, and heartbeat frames. Events use product-owned kinds with bounded metadata; runtime methods, raw commands, logs, private paths, job instructions, and provider payloads are excluded.
      security:
        - operatorSession: []
      responses:
        "200":
          description: Server-sent Operational Activity snapshots, normalized events, and heartbeats
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Web Owner session required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/git/recent-commits:
    get:
      operationId: getRecentCommits
      summary: Get recent git commit summaries
      description: Returns recent commit metadata so GPT and operators can inspect the latest repository changes without reading the full git history.
      security:
        - bearerAuth: []
      parameters:
        - name: repoId
          in: query
          required: false
          schema:
            type: string
          description: Public repository alias. Defaults to primary.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: executorId
          in: query
          required: false
          description: Optional explicit Direct Drive executor id. When set, ChatCockpit will not silently fall back to another executor.
          schema:
            type: string
      responses:
        "200":
          description: Recent commits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentCommitsResponse'
  /api/jobs/pack:
    post:
      operationId: createPack
      summary: Queue a repo bundle job
      description: Creates a queued pack job that produces a repomix bundle and bundle manifest for an approved repo alias. If repoId is omitted, the current default repo primary is used.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackJobPayload'
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePackResponse'
  /api/jobs/taskpack:
    post:
      operationId: createTaskPack
      summary: Queue a Codex task pack job
      description: Creates a queued task-pack job from a structured problem description.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPackJobPayload'
      responses:
        "200":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskPackResponse'
  /api/jobs/codex-run:
    post:
      operationId: createCodexRun
      summary: Queue a local Codex CLI execution job
      description: Creates a queued write-side job that the local runner executes through Codex CLI in an allowlisted repo. This is not a raw shell endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodexRunJobPayload'
      responses:
        "200":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCodexRunResponse'
  /api/jobs:
    get:
      operationId: listJobs
      summary: List queued and completed jobs
      description: Returns a bounded job summary page from the local ChatCockpit queue. Results are omitted by default; call getJob for detail or set includeResult=true for explicit operator inspection.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Offset cursor returned by the previous listJobs response.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, completed, failed]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [pack, taskpack, codex-run]
        - name: includeResult
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false", "1", "0"]
          description: Defaults to false for compact GPT Actions responses.
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsListResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/jobs/{id}:
    get:
      operationId: getJob
      summary: Get a single job status
      description: Returns a single queued, running, completed, or failed job by id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobResponse'
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/jobs/{id}/artifacts:
    get:
      operationId: listJobArtifacts
      summary: List public-safe artifacts for a job
      description: Returns the artifact entries declared by the selected job result.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobArtifactsListResponse'
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/jobs/{id}/artifacts/{artifactKey}:
    get:
      operationId: readJobArtifact
      summary: Read a public-safe artifact by key
      description: Reads a single text-like artifact that was declared by a completed job result.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: artifactKey
          in: path
          required: true
          schema:
            type: string
            enum: [repomixXml, prompt, summary, manifest, markdown, json, codexPrompt, codexStdout, codexStderr, codexDiff, codexReview, codexSummary]
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Artifact content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobArtifactReadResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Artifact or job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/jobs/{id}/control:
    post:
      operationId: controlJobProcess
      summary: Control a tracked local job process
      description: Applies one revision-bound, idempotent pause, resume, or terminate action and records a public-safe append-only control event. PID, command, paths, job instructions, and process output are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobProcessControlPayload'
      responses:
        "200":
          description: Applied or replayed control result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobControlResponse'
        "409":
          description: Revision, state, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/jobs/{id}/control/{action}:
    post:
      operationId: controlJobLegacy
      deprecated: true
      summary: Legacy tracked Job process control compatibility route
      description: Compatibility route for older clients. New clients use POST /api/jobs/{id}/control with expectedRevision and idempotencyKey. The server still routes this call through the formal Job process control service.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [pause, resume, terminate]
      responses:
        "200":
          description: Compatibility control result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyJobControlResponse'
  /api/jobs/control/terminate-all:
    post:
      operationId: terminateAllJobs
      summary: Terminate all tracked local Codex job processes
      description: Emergency stop for ChatCockpit-tracked Codex job processes. This is not a raw shell endpoint.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Termination summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminateAllJobsResponse'
  /api/host/roots:
    get:
      operationId: listHostDirectRoots
      summary: List public-safe Host Direct root aliases
      description: Lists local Host Direct root aliases and read access without exposing local absolute paths.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Host Direct root aliases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDirectRootsResponse'
  /api/host/files/read:
    post:
      operationId: readHostDirectFile
      summary: Read a small text-like file from an allowlisted Host Direct root
      description: Reads one text-like file up to 64 KiB through a configured Host Root Alias and a verified Host Direct executor. Absolute paths, traversal, sensitive hidden paths, and symlink escapes are rejected before downstream execution.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostFileReadPayload'
      responses:
        "200":
          description: Host file content using a public-safe alias path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostFileReadResponse'
        "403":
          description: Host path or root access is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Host root or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "413":
          description: Host file exceeds the current read-only size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/mutations/prepare:
    post:
      operationId: prepareHostDirectMutation
      summary: Prepare one governed Host text-file write or exact edit
      description: Validates Host Root write access, path safety, Workspace re-entry, Writer Lease and a verified Host executor, then creates a short-lived exact-mutation approval. No file is modified by this step.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostMutationPreparePayload'
      responses:
        "200":
          description: Pending Direct Mutation approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostMutationApprovalResponse'
        "403":
          description: Host Root or path policy blocks mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Workspace governance, revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "413":
          description: Mutation content exceeds the Host text-file size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/mutations/decision:
    post:
      operationId: decideHostDirectMutation
      summary: Approve or deny one pending Host mutation
      description: Applies an optimistic-revision approval decision without contacting the downstream executor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostMutationDecisionPayload'
      responses:
        "200":
          description: Updated Direct Mutation approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostMutationApprovalResponse'
        "409":
          description: Approval expired, already decided, or revision/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/mutations/execute:
    post:
      operationId: executeHostDirectMutation
      summary: Execute one approved Host text-file write or exact edit
      description: Revalidates the full approved mutation, current file hash, Workspace governance and verified executor mapping, consumes the approval at-most-once, executes through the normalized downstream capability, then verifies the resulting file hash and records Task Evidence or Pure Host Audit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostMutationExecutePayload'
      responses:
        "200":
          description: Verified Host mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostMutationExecuteResponse'
        "403":
          description: Host Root or path policy blocks mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Approval, hash, Workspace governance, revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "413":
          description: Mutation content exceeds the Host text-file size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/commands/prepare:
    post:
      operationId: prepareHostDirectCommand
      summary: Prepare one governed bounded Host command
      description: Resolves the Host workdir, applies command/effect policy, re-enters Workspace Writer Lease governance for write effects, verifies Desktop Commander process capabilities, and creates a short-lived exact-command approval without starting a process.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCommandPreparePayload'
      responses:
        "200":
          description: Pending Direct Command approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandApprovalResponse'
        "403":
          description: Host Root, path, command policy, or effect policy blocks execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Workspace governance, revision, executor, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/commands/decision:
    post:
      operationId: decideHostDirectCommand
      summary: Approve or deny one pending Host command
      description: Applies an optimistic-revision decision without starting a process.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCommandDecisionPayload'
      responses:
        "200":
          description: Updated Direct Command approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandApprovalResponse'
        "409":
          description: Approval expired, already decided, consumed, or revision/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/commands/execute:
    post:
      operationId: executeHostDirectCommand
      summary: Execute one approved bounded non-interactive Host command
      description: Revalidates the approved command and governance, consumes approval at-most-once, runs the private bounded Desktop Commander process lifecycle, terminates non-terminal commands, bounds public output, and records Audit or Task Evidence without exposing PID or private cwd.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCommandExecutePayload'
      responses:
        "200":
          description: Host command result, including honest non-zero or timeout outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostCommandExecuteResponse'
        "403":
          description: Host Root, path, command policy, or effect policy blocks execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Approval, hash, Workspace governance, revision, executor, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "502":
          description: Downstream process lifecycle is invalid, unavailable, or has an unknown terminal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "504":
          description: Host command exceeded the bounded execution timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/processes/prepare:
    post:
      operationId: prepareHostManagedProcess
      summary: Prepare one Managed Workspace Process action
      description: Validates one exact start, input, or stop action and creates a short-lived Direct Process approval. Start/input remain Workspace-governed; stop stays available to the owning Session for cleanup. No external process action occurs here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProcessPreparePayload'
      responses:
        "200":
          description: Pending Direct Process approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostProcessApprovalResponse'
        "400":
          description: Invalid structured command or transient process input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Process scope, policy, or ownership is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Workspace, Writer Lease, quota, approval, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/processes/decision:
    post:
      operationId: decideHostManagedProcess
      summary: Approve or deny one Managed Process action
      description: Applies an optimistic-revision decision to a short-lived Direct Process approval without invoking Desktop Commander.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProcessDecisionPayload'
      responses:
        "200":
          description: Updated Direct Process approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostProcessApprovalResponse'
        "409":
          description: Approval expired, already decided, consumed, or revision/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/processes/execute:
    post:
      operationId: executeHostManagedProcess
      summary: Execute one approved Managed Process action
      description: Executes an approved start, input, or stop through a ChatCockpit-owned process identity. Downstream PID/session handles remain private, mutation results exclude stdout, and Audit/Evidence record only public-safe metadata.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProcessExecutePayload'
      responses:
        "200":
          description: Managed Process action result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostProcessActionResponse'
        "403":
          description: Process scope, policy, or ownership is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Process state, Writer Lease, approval, hash, revision, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "502":
          description: Managed downstream process action failed or has an unknown terminal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "503":
          description: Verified Desktop Commander managed-process dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/processes/read:
    post:
      operationId: readHostManagedProcess
      summary: Read bounded Managed Process output
      description: Reads public-safe output for one ChatCockpit processId, reconciles Writer Lease/runtime ownership, and updates terminal state when observed. OS PID is never accepted or returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostProcessReadPayload'
      responses:
        "200":
          description: Managed Process output and current public state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostProcessReadResponse'
        "404":
          description: Managed Process not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Managed Process is stale or not readable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/host/processes:
    get:
      operationId: listHostManagedProcesses
      summary: List ChatCockpit Managed Process records
      description: Lists public-safe ChatCockpit process identities and state after runtime/Writer Lease reconciliation. Raw downstream sessions and OS PIDs are never projected.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: workspaceId
          schema:
            type: string
        - in: query
          name: sessionId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [starting, running, exited, terminated, failed, stale]
      responses:
        "200":
          description: Public-safe Managed Process records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostProcessListResponse'
  /api/files/read:
    post:
      operationId: readFile
      summary: Read a single allowlisted text file
      description: Reads a single relative text file from an allowlisted repository mapping.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileReadPayload'
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadFileResponse'
        "400":
          description: Validation or path safety error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/files/read-batch:
    post:
      operationId: readFiles
      summary: Read multiple allowlisted text files
      description: Reads up to 10 relative text files from an allowlisted repository mapping.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileReadBatchPayload'
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadFilesResponse'
        "400":
          description: Validation or path safety error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/files/write:
    post:
      operationId: writeFile
      summary: Write or overwrite a text file
      description: Creates or overwrites a single text file in an allowlisted repository. Content size limited to 512 KB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWritePayload'
      responses:
        "200":
          description: File written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResponse'
  /api/files/edit:
    post:
      operationId: editFile
      summary: Search-and-replace edit in a text file
      description: Finds a unique occurrence of search text and replaces it. Search text must appear exactly once in the file.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileEditPayload'
      responses:
        "200":
          description: Edit applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEditResponse'
  /api/files/list:
    post:
      operationId: listDirectory
      summary: List directory contents
      description: Lists files and subdirectories in a directory within an allowlisted repository. Hidden files are excluded except common config files.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileListPayload'
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'
  /api/search:
    post:
      operationId: searchCode
      summary: Search code across the repository
      description: Runs ripgrep (or grep fallback) across an allowlisted repository. Returns up to 40 matches with optional context lines.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchPayload'
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
  /api/shell/run:
    post:
      operationId: runShell
      summary: Run a whitelisted shell command
      description: Runs an allowlisted command in an approved repo. Output is capped at 64 KB and 25 seconds. High-trust commands such as node, python, npx, tsx, and make are blocked in exposed mode unless explicitly enabled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShellRunPayload'
      responses:
        "200":
          description: Command output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellRunResponse'
  /api/git/diff:
    get:
      operationId: getGitDiff
      summary: Get the current git diff
      description: Returns the working tree diff (unstaged changes by default). Public-safe paths only; env files, ChatCockpit runtime state, logs, and local agent state are omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: repoId
          in: query
          required: false
          schema:
            type: string
            default: primary
        - name: staged
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false", "1", "0"]
        - name: executorId
          in: query
          required: false
          description: Optional explicit Direct Drive executor id. When set, ChatCockpit will not silently fall back to another executor.
          schema:
            type: string
      responses:
        "200":
          description: Git diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitDiffResponse'
  /api/git/status:
    get:
      operationId: getGitStatus
      summary: Get the current git status
      description: Returns the working tree status including branch name and per-file status entries. Public-safe paths only.
      security:
        - bearerAuth: []
      parameters:
        - name: repoId
          in: query
          required: false
          schema:
            type: string
            default: primary
        - name: executorId
          in: query
          required: false
          description: Optional explicit Direct Drive executor id. When set, ChatCockpit will not silently fall back to another executor.
          schema:
            type: string
      responses:
        "200":
          description: Git status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatusResponse'
  /api/git/commit:
    post:
      operationId: gitCommit
      summary: Stage public-safe changes and commit
      description: Stages only public-safe changed paths and creates a commit with the given message. Env files, ChatCockpit runtime state, logs, and local agent state are not staged by this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitCommitPayload'
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommitResponse'
  /api/continuity/projects:
    get:
      operationId: listContinuityProjects
      summary: List continuity projects
      description: Synchronizes allowlisted repo mappings into durable ChatCockpit project and workspace identities. Local absolute paths are omitted from the response.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived]
      responses:
        "200":
          description: Public-safe project projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReadResponse'
  /api/continuity/projects/{projectId}:
    get:
      operationId: getContinuityProject
      summary: Read continuity project
      description: Returns one durable project and its public-safe workspace projections.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReadResponse'
  /api/continuity/workspaces/{workspaceId}/snapshot:
    get:
      operationId: getWorkspaceContinuitySnapshot
      summary: Read workspace continuity snapshot
      description: Returns public-safe Git, active writer, task, session, handoff, evidence, and pending approval state for one workspace.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace continuity snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceContinuitySnapshotResponse'
  /api/continuity/documents:
    get:
      operationId: listDevelopmentDocuments
      summary: List Spec and Plan documents
      description: Returns public-safe document summaries for one workspace without returning Markdown bodies.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [spec, plan]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, ready, approved, superseded, archived]
      responses:
        "200":
          description: Document summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDocumentListResponse'
    post:
      operationId: createDevelopmentDocument
      summary: Create Spec or Plan document
      description: Creates one draft Spec or Plan and immutable version 1 using an idempotency key.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentDocumentCreatePayload'
      responses:
        "200":
          description: Created or replayed document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDocumentMutationResponse'
  /api/continuity/documents/{documentId}:
    get:
      operationId: getDevelopmentDocument
      summary: Read Spec or Plan document
      description: Returns one document, its current public-safe Markdown, and append-only version summaries.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDocumentReadResponse'
  /api/continuity/documents/{documentId}/versions/{version}:
    get:
      operationId: getDevelopmentDocumentVersion
      summary: Read immutable Spec or Plan version
      description: Returns one public-safe Markdown version by document id and version number.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Immutable document version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDocumentVersionReadResponse'
  /api/continuity/documents/append-version:
    post:
      operationId: appendDevelopmentDocumentVersion
      summary: Append Spec or Plan version
      description: Appends immutable Markdown and returns the document to draft when a ready or approved version changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentDocumentAppendVersionPayload'
      responses:
        "200":
          description: Appended or replayed version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDocumentMutationResponse'
  /api/continuity/documents/update-status:
    post:
      operationId: updateDevelopmentDocumentStatus
      summary: Update Spec or Plan lifecycle status
      description: Applies a reviewed lifecycle transition with optimistic revision and idempotency controls.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevelopmentDocumentStatusPayload'
      responses:
        "200":
          description: Updated or replayed document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentDocumentMutationResponse'
  /api/continuity/tasks/bind-documents:
    post:
      operationId: bindTaskDevelopmentDocuments
      summary: Bind Task Spec and Plan versions
      description: Pins the current immutable Spec and Plan versions after validating kind, ownership, lifecycle state, and Task revision.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDocumentBindPayload'
      responses:
        "200":
          description: Bound or replayed Task document state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDocumentBindResponse'
  /api/continuity/async-jobs/queue:
    post:
      operationId: queueContinuityAsyncJob
      summary: Queue a continuity-bound async Job
      description: Creates one file-backed Codex Runner Job for an active async-agent Session, persists the Job ID as a ChatCockpit Runner Runtime Binding, and replays the original result for the same idempotency key.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncJobQueuePayload'
      responses:
        "200":
          description: Job queued or idempotently replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobQueueResponse'
        "409":
          description: Session, revision, workspace, Runtime Binding, or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/continuity/tasks:
    post:
      operationId: createContinuityTask
      summary: Create continuity task
      description: Creates a durable project task. The idempotency key prevents duplicate task creation across REST and MCP retries.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityTaskCreatePayload'
      responses:
        "200":
          description: Created or replayed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/tasks/submit-review:
    post:
      operationId: submitContinuityTaskReview
      summary: Submit continuity task for review
      description: Finalizes passed required evidence and moves an in-progress or blocked task into review through one idempotent transition.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityTaskSubmitReviewPayload'
      responses:
        "200":
          description: Submitted or replayed task review transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityTaskSubmitReviewResponse'
        "409":
          description: Review evidence requirements are not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/continuity/tasks/complete:
    post:
      operationId: completeContinuityTask
      summary: Complete continuity task
      description: Completes a review task only after accepted handoff, required evidence, writer, runtime run, and approval checks pass.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityTaskCompletePayload'
      responses:
        "200":
          description: Completed or replayed task transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityTaskCompleteResponse'
        "409":
          description: Completion requirements are not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/continuity/tasks/{taskId}:
    get:
      operationId: getContinuityTask
      summary: Read continuity task
      description: Returns one durable ChatCockpit task by id.
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReadResponse'
  /api/continuity/sessions/start:
    post:
      operationId: startContinuitySession
      summary: Start development session
      description: Starts a Chat Direct, Codex Session, or Async Agent session and binds it to the expected task revision.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuitySessionStartPayload'
      responses:
        "200":
          description: Started or replayed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/sessions/{sessionId}:
    get:
      operationId: getContinuitySession
      summary: Read development session
      description: Returns one durable ChatCockpit development session by id.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReadResponse'
  /api/continuity/leases/acquire:
    post:
      operationId: acquireContinuityLease
      summary: Acquire workspace writer lease
      description: Acquires the only active writer lease allowed for a workspace. Another active session receives a conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityLeaseAcquirePayload'
      responses:
        "200":
          description: Acquired or replayed writer lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/leases/release:
    post:
      operationId: releaseContinuityLease
      summary: Release workspace writer lease
      description: Releases an active writer lease using lease identity, holder identity, revision, and idempotency control.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityLeaseReleasePayload'
      responses:
        "200":
          description: Released or replayed writer lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/handoffs/prepare:
    post:
      operationId: prepareContinuityHandoff
      summary: Prepare development handoff
      description: Creates a ready handoff checkpoint with goal, progress, pending work, changed files, risks, Git state, evidence, and next action.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityHandoffPreparePayload'
      responses:
        "200":
          description: Ready or replayed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/handoffs/cancel:
    post:
      operationId: cancelContinuityHandoff
      summary: Cancel development handoff
      description: Supersedes one ready handoff with optimistic revision and idempotency controls.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityHandoffCancelPayload'
      responses:
        "200":
          description: Cancelled or replayed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/handoffs/fork:
    post:
      operationId: forkContinuityHandoff
      summary: Fork development handoff
      description: Consumes one ready handoff by creating a child task and target-mode development session in one transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityHandoffForkPayload'
      responses:
        "200":
          description: Forked or replayed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/handoffs/accept:
    post:
      operationId: acceptContinuityHandoff
      summary: Accept development handoff
      description: Accepts one ready handoff with optimistic revision and idempotency controls.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityHandoffAcceptPayload'
      responses:
        "200":
          description: Accepted or replayed handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/continuity/evidence/record:
    post:
      operationId: recordContinuityEvidence
      summary: Record verification evidence
      description: Records structured verification evidence for a task session and optionally creates a new evidence bundle.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityEvidenceRecordPayload'
      responses:
        "200":
          description: Recorded or replayed evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityMutationResponse'
  /api/recovery/assess:
    post:
      operationId: assessRuntimeRecovery
      summary: Assess runtime recovery
      description: Inspect ChatCockpit continuity and local provider state, then persist a short-lived Recovery Attempt. This operation never resumes, forks, binds, starts a model turn, creates a job, or mutates workspace files.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRecoveryAssessPayload'
      responses:
        "200":
          description: Recovery assessment and prepared attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRecoveryAssessResponse'
        "409":
          description: Recovery assessment is blocked by continuity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/recovery/execute:
    post:
      operationId: executeRuntimeRecovery
      summary: Execute explicit runtime recovery
      description: Execute one server-approved Recovery action after revalidating the persisted assessment hash and current runtime/governance state. Recovery never implicitly starts a model turn or auto-switches provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeRecoveryExecutePayload'
      responses:
        "200":
          description: Applied or replayed explicit Recovery action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRecoveryExecuteResponse'
        "409":
          description: Recovery Attempt expired, drifted, or action is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/recovery/attempts:
    get:
      operationId: listRuntimeRecoveryAttempts
      summary: List runtime recovery attempts
      description: Read persisted public-safe Recovery Attempt history without provider credentials, private paths, raw transcripts, prompts, reasoning, stderr, or process identifiers.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: taskId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recovery Attempt history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRecoveryAttemptListResponse'
  /api/recovery/attempts/{recoveryId}:
    get:
      operationId: getRuntimeRecoveryAttempt
      summary: Read runtime recovery attempt
      description: Read one persisted public-safe Recovery Attempt by ChatCockpit recovery id.
      security:
        - bearerAuth: []
      parameters:
        - name: recoveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recovery Attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRecoveryAttemptReadResponse'
        "404":
          description: Recovery Attempt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/providers:
    get:
      operationId: listCapabilityProviders
      summary: List managed capability providers
      description: Returns the public-safe Resource Center management view for the local device, including detection, version, health, capabilities, configuration, exposure, desired/observed state, lifecycle actions, and verification.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider management projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                    const: true
                  target:
                    $ref: '#/components/schemas/DeviceTargetDescriptor'
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapabilityProviderManagementDescriptor'
                required: [ok, target, providers]
  /api/resources/runtime-profiles:
    get:
      operationId: listRuntimeResourceProfiles
      summary: List resource providers and runtime profiles
      description: Lists public-safe Runtime Profiles and the provider-management read model for detection, version, health, capabilities, configuration, exposure, desired/observed state, lifecycle actions, and verification. Private execution configuration and credentials are omitted.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Runtime Profile catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceProfileListResponse'
  /api/resources/inventory:
    post:
      operationId: inventoryRuntimeResources
      summary: Inventory one runtime profile
      description: Reads one explicit Runtime Profile through reviewed adapters, persists a public-safe Schema v15 snapshot, and returns a deterministic diff. No resource mutation is performed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResourceInventoryPayload'
      responses:
        "200":
          description: Runtime Resource snapshot and diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceInventoryResponse'
        "400":
          description: Invalid inventory input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Runtime Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "503":
          description: Selected external catalog or runtime source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/snapshots/{snapshotId}:
    get:
      operationId: getRuntimeResourceSnapshot
      summary: Read runtime resource snapshot
      description: Reads one persisted public-safe Runtime Resource Snapshot. Provider raw payloads and private locators are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Runtime Resource Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceSnapshotReadResponse'
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/items/{resourceId}:
    get:
      operationId: inspectRuntimeResource
      summary: Inspect latest runtime resource state
      description: Reads the newest persisted observation of one stable Runtime Resource ID together with its source snapshot.
      security:
        - bearerAuth: []
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest Runtime Resource observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceInspectResponse'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/capabilities/mutations/decision:
    post:
      operationId: decideCapabilityRouterMutation
      summary: Decide a governed Capability Router mutation approval
      description: Approves or denies one pending provider-native mutation. Requires an authenticated local operator session plus CSRF; machine Bearer, MCP OAuth, and Remote MCP cannot decide. Public responses omit raw arguments, hashes, transport configuration, and provider results.
      security:
        - operatorSession: []
      parameters:
        - name: x-chatcockpit-csrf
          in: header
          required: true
          description: CSRF token issued with the authenticated operator session.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRouterMutationDecisionPayload'
      responses:
        "200":
          description: Decided public-safe approval or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityRouterMutationApprovalResponse'
        "400":
          description: Invalid strict decision input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "401":
          description: Authenticated operator session is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Caller is not an operator session or CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Capability Router mutation approval not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Approval expired, stale, already decided, revision-conflicted, or idempotency-conflicted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/mutations/prepare:
    post:
      operationId: prepareRuntimeResourceMutation
      summary: Prepare a governed runtime resource mutation
      description: Creates a short-lived approval bound to the reviewed snapshot, then revalidates the target Resource from fresh authoritative state without provider mutation. Exposed mode also requires CHATCOCKPIT_RESOURCE_MUTATIONS_EXPOSED=true. Strict input rejects provider selectors and provenance fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResourceMutationPreparePayload'
      responses:
        "200":
          description: Pending approval or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMutationApprovalResponse'
        "400":
          description: Invalid strict mutation input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Resource mutation writes are disabled for this exposed deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Resource is stale, unsupported, already in the requested state, or idempotency conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/mutations/decision:
    post:
      operationId: decideRuntimeResourceMutation
      summary: Decide a governed runtime resource mutation approval
      description: Approves or denies one pending short-lived Resource mutation approval using optimistic revision control. The authenticated REST API token is an operator credential. Raw actor ids and request ids are hashed internally and never returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResourceMutationDecisionPayload'
      responses:
        "200":
          description: Decided approval or idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMutationApprovalResponse'
        "400":
          description: Invalid strict decision input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Resource mutation writes are disabled for this exposed deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Approval expired, stale, already decided, or revision conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/mutations/execute:
    post:
      operationId: executeRuntimeResourceMutation
      summary: Execute an approved runtime resource mutation
      description: Revalidates the approved Resource intent against fresh provider truth, consumes the approval, issues at most one reviewed provider write, and verifies the authoritative postflight state. Provider selectors remain private and cannot be supplied by callers.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeResourceMutationExecutePayload'
      responses:
        "200":
          description: Verified, failed, stale, or idempotently replayed execution evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMutationExecuteResponse'
        "400":
          description: Invalid strict execution input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Resource mutation writes are disabled for this exposed deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "409":
          description: Approval expired, consumed, stale, mismatched, or revision conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/mutations/approvals/{approvalId}:
    get:
      operationId: getRuntimeResourceMutationApproval
      summary: Read runtime resource mutation approval
      description: Reads a workspace-scoped public-safe approval projection. Mutation hashes, raw request identities, provider selectors, private paths, and provider payloads are omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string }
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public-safe mutation approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMutationApprovalReadResponse'
        "404":
          description: Approval not found in the requested Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/mutations/executions/{executionId}:
    get:
      operationId: getRuntimeResourceMutationExecution
      summary: Read runtime resource mutation execution
      description: Reads a workspace-scoped public-safe execution projection without raw provider payloads or private selector material.
      security:
        - bearerAuth: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: string }
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public-safe mutation execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMutationExecutionReadResponse'
        "404":
          description: Execution not found in the requested Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/resources/mutations/activity:
    get:
      operationId: listRuntimeResourceMutationActivity
      summary: List runtime resource mutation activity
      description: Lists bounded workspace-scoped public-safe approvals and executions for Resource Center reload and audit display. Default server limit is 25 and the hard maximum is 100.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string }
        - name: resourceId
          in: query
          required: false
          schema: { type: string }
        - name: approvalStatus
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, denied, expired, stale, consumed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Public-safe mutation activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResourceMutationActivityResponse'
        "400":
          description: Missing Workspace scope or invalid bounded query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/runtime/codex/capabilities:
    get:
      operationId: getCodexRuntimeCapabilities
      summary: Read Codex App Server capabilities
      description: Returns a public-safe availability and protocol snapshot. Binary paths and local diagnostics are not exposed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Codex runtime capability snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCapabilitiesResponse'
  /api/runtime/codex/threads:
    get:
      operationId: listCodexRuntimeThreads
      summary: List Codex thread metadata
      description: Lists public-safe Codex thread metadata. Raw cwd, instruction sources, rollout paths, and turn contents are omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
          description: ChatCockpit workspace id. The private workspace path is resolved only inside the local runtime.
        - name: searchTerm
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Public-safe thread list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeThreadListResponse'
  /api/runtime/codex/threads/{threadId}:
    get:
      operationId: getCodexRuntimeThread
      summary: Read Codex thread metadata
      description: Reads one public-safe thread metadata projection. Turn history remains unavailable until ChatCockpit defines and verifies a safe projection.
      security:
        - bearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - name: includeTurns
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Must remain false in the current read-only adapter. True returns CAPABILITY_UNAVAILABLE.
      responses:
        "200":
          description: Public-safe thread metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeThreadReadResponse'
  /api/runtime/codex/sessions/bind:
    post:
      operationId: bindCodexRuntimeSession
      summary: Bind an existing Codex thread
      description: Validates ChatCockpit session revision and workspace identity, then binds an existing Codex thread without starting a Codex turn. Repeated requests with the same idempotency key replay the original result.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSessionMutationPayload'
      responses:
        "200":
          description: Created or replayed runtime binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBindingMutationResponse'
  /api/runtime/codex/sessions/resume:
    post:
      operationId: resumeCodexRuntimeSession
      summary: Resume and bind a Codex thread
      description: Resumes an existing Codex App Server thread and persists the binding with two-phase idempotency. This operation does not start a Codex turn. An uncertain external result remains pending to prevent duplicate resume side effects.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSessionMutationPayload'
      responses:
        "200":
          description: Resumed or replayed runtime binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBindingMutationResponse'
  /api/runtime/codex/sessions/fork:
    post:
      operationId: forkCodexRuntimeSession
      summary: Fork and bind a Codex thread
      description: Creates a durable non-ephemeral Codex thread fork and binds it to the ChatCockpit session with two-phase idempotency. An optional lastTurnId limits the fork boundary. This operation does not start a Codex turn.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSessionForkPayload'
      responses:
        "200":
          description: Forked or replayed runtime binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeBindingMutationResponse'
  /api/runtime/codex/turns/start:
    post:
      operationId: startCodexRuntimeTurn
      summary: Start an explicit Codex turn
      description: Starts one Codex model loop after validating Runtime Binding, revisions, Writer Lease, Git checkpoint, Evidence, and Handoff. Approval is fixed to on-request user review. cwd, model, sandbox, approval, and instruction overrides are unavailable. Retries use two-phase idempotency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeTurnStartPayload'
      responses:
        "200":
          description: Started or replayed Codex turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeTurnStartResponse'
  /api/runtime/codex/turns/interrupt:
    post:
      operationId: interruptCodexRuntimeTurn
      summary: Interrupt an active Codex turn
      description: Explicitly interrupts one active bound Codex turn, releases its Writer Lease, moves the Development Session to handoff-ready, and records an append-only lifecycle event. The operation is idempotent across REST and MCP retries.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeTurnInterruptPayload'
      responses:
        "200":
          description: Interrupted or replayed Codex turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeTurnInterruptResponse'
  /api/runtime/codex/approvals/respond:
    post:
      operationId: respondToCodexRuntimeApproval
      summary: Respond to a pending Codex approval
      description: Sends an explicit accept, decline, or cancel decision for one pending command-execution or file-change approval. Session-wide approval and permission escalation are intentionally unavailable. Internal App Server request handles and raw private request parameters are never returned by this API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeApprovalRespondPayload'
      responses:
        "200":
          description: Responded or replayed approval decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeApprovalRespondResponse'
  /api/runtime/codex/events:
    get:
      operationId: readCodexRuntimeEvents
      summary: Read public-safe Codex runtime events
      description: Reads append-only lifecycle, approval, item, warning, and error events for one ChatCockpit Session or Runtime Run. Raw prompts, command output, cwd, file patches, private approval payloads, and App Server request handles are omitted.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
          description: Filter by ChatCockpit Development Session. sessionId or runId is required.
        - name: runId
          in: query
          required: false
          schema:
            type: string
          description: Filter by ChatCockpit Runtime Run. sessionId or runId is required.
        - name: afterSequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Return events after this append-only sequence cursor.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Public-safe runtime event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeEventsResponse'
