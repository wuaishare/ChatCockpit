openapi: 3.1.0
info:
  title: ChatCockpit Local Control Plane API
  version: 0.1.0-alpha
  description: >
    Local-first automation surface for ChatCockpit. Phase 2 supports ChatGPT direct-drive
    operations for small trusted edits plus asynchronous Codex jobs for complex work. The
    full HTTPS / Custom GPT Actions automation loop remains under validation.
servers:
  - url: https://chatcockpit.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    operatorSession:
      type: apiKey
      in: cookie
      name: chatcockpit_operator_session
      description: Authenticated local Web operator session. Mutation decisions also require the x-chatcockpit-csrf header.
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
        hint:
          type: string
        details: {}
      required: [code, message]
    ApiErrorResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ApiError'
      required: [ok, error]
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        mode:
          type: string
        authRequired:
          type: boolean
        exposed:
          type: boolean
        publicBaseUrl:
          oneOf:
            - type: string
            - type: "null"
        openapiUrl:
          type: string
      required: [ok, mode, authRequired, exposed, publicBaseUrl, openapiUrl]
    SetupStatusStep:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          enum: [runtime, auth, oauth, repo, runner, gpt, firstTask]
        ok:
          type: boolean
        label:
          type: string
        detail:
          type: string
        nextAction:
          type: string
      required: [key, ok, label, detail, nextAction]
    SetupStatusResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        ready:
          type: boolean
        authRequired:
          type: boolean
        exposed:
          type: boolean
        publicBaseUrlConfigured:
          type: boolean
        oauthStatus:
          type: string
          enum: [disabled, ready, needs-attention]
        oauthProtectedResourceMetadataUrl:
          oneOf:
            - type: string
            - type: "null"
        openapiUrl:
          type: string
        runnerStatus:
          type: string
          enum: [missing, ready]
        firstTaskSeen:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SetupStatusStep'
      required: [ok, ready, authRequired, exposed, publicBaseUrlConfigured, oauthStatus, oauthProtectedResourceMetadataUrl, openapiUrl, runnerStatus, firstTaskSeen, steps]
    GptConfig:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          description: Product-facing display version, for example v0.1.0-alpha (53).
        productVersion:
          type: string
          description: Product release version from package metadata, for example v0.1.0-alpha.
        schemaVersion:
          type: string
          description: GPT instructions and OpenAPI schema revision shown in parentheses.
        buildVersion:
          type: string
          description: Git commit time version used as tooltip/debug detail, for example 26.0531.213301.
        updatedAt:
          type: string
        actionHost:
          type: string
        openapiUrl:
          type: string
        publicBaseUrl:
          oneOf:
            - type: string
            - type: "null"
        schemaImportUrl:
          type: string
        repoGovernance:
          $ref: '#/components/schemas/RepoGovernance'
        instructions:
          type: string
        notes:
          type: array
          items:
            type: string
      required: [version, productVersion, schemaVersion, buildVersion, updatedAt, actionHost, openapiUrl, publicBaseUrl, schemaImportUrl, repoGovernance, instructions, notes]
    RepoGovernance:
      type: object
      additionalProperties: false
      properties:
        defaultRepoId:
          type: string
        configScope:
          type: string
          enum: [local-private]
        pathVisibility:
          type: string
          enum: [hidden]
        repos:
          type: array
          items:
            $ref: '#/components/schemas/RepoGovernanceEntry'
      required: [defaultRepoId, configScope, pathVisibility, repos]
    RepoGovernanceEntry:
      type: object
      additionalProperties: false
      properties:
        repoId:
          type: string
        status:
          type: string
          enum: [enabled, missing, blocked]
        defaultRepo:
          type: boolean
        source:
          type: string
          enum: [default, default-sibling, local-config]
        pathConfigured:
          type: boolean
        allowlisted:
          type: boolean
        pathVisibility:
          type: string
          enum: [hidden]
        capabilities:
          type: array
          items:
            type: string
            enum: [pack, files-read, codex-run]
      required: [repoId, status, defaultRepo, source, pathConfigured, allowlisted, pathVisibility, capabilities]
    GptConfigResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        config:
          $ref: '#/components/schemas/GptConfig'
      required: [ok, config]
    IntegrationMcpStatus:
      type: object
      additionalProperties: false
      properties:
        endpoint:
          oneOf:
            - type: string
            - type: "null"
        scope:
          type: string
          const: chatcockpit:mcp
        oauthStatus:
          type: string
          enum: [disabled, ready, needs-attention]
        oauthReady:
          type: boolean
        authorizedClientCount:
          type: integer
          minimum: 0
        activeAuthorizationGrantCount:
          type: integer
          minimum: 0
        activeAccessTokenCount:
          type: integer
          minimum: 0
        activeRefreshTokenCount:
          type: integer
          minimum: 0
        toolCatalogStatus:
          type: string
          const: ready
        toolCount:
          type: integer
          minimum: 0
      required: [endpoint, scope, oauthStatus, oauthReady, authorizedClientCount, activeAuthorizationGrantCount, activeAccessTokenCount, activeRefreshTokenCount, toolCatalogStatus, toolCount]
    IntegrationStatusResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        localCockpitUrl:
          type: string
        publicCockpitUrl:
          oneOf:
            - type: string
            - type: "null"
        localApiBaseUrl:
          type: string
        publicApiBaseUrl:
          oneOf:
            - type: string
            - type: "null"
        openapiUrl:
          type: string
        lanAccess:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            status:
              type: string
              enum: [disabled, listener-loopback, no-trusted-address, ready]
            trustedCidrs:
              type: array
              items:
                type: string
            cockpitUrls:
              type: array
              items:
                type: string
            apiBaseUrls:
              type: array
              items:
                type: string
          required: [enabled, status, trustedCidrs, cockpitUrls, apiBaseUrls]
        mcp:
          $ref: '#/components/schemas/IntegrationMcpStatus'
        machineApi:
          type: object
          additionalProperties: false
          properties:
            configured:
              type: boolean
          required: [configured]
      required: [ok, localCockpitUrl, publicCockpitUrl, localApiBaseUrl, publicApiBaseUrl, openapiUrl, lanAccess, mcp, machineApi]
    OAuthAuthorizationGrantSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        clientRegistrationId:
          type: string
        displayLabel:
          type: string
        scope:
          type: string
        resource:
          type: string
        status:
          type: string
          enum: [pending, active, inactive, revoked]
        legacy:
          type: boolean
        createdAt:
          type: string
        lastTokenIssuedAt:
          oneOf:
            - type: string
            - type: "null"
        revokedAt:
          oneOf:
            - type: string
            - type: "null"
        activeAccessTokenCount:
          type: integer
          minimum: 0
        activeRefreshTokenCount:
          type: integer
          minimum: 0
      required: [id, clientRegistrationId, displayLabel, scope, resource, status, legacy, createdAt, lastTokenIssuedAt, revokedAt, activeAccessTokenCount, activeRefreshTokenCount]
    OAuthAuthorizationGrantsResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        enabled:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/OAuthAuthorizationGrantSummary'
      required: [ok, enabled, grants]
    OAuthAuthorizationGrantMutationResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        grant:
          $ref: '#/components/schemas/OAuthAuthorizationGrantSummary'
      required: [ok, grant]
    OperationalActivityRuntime:
      type: object
      additionalProperties: false
      properties:
        bindingId: { type: string }
        runtimeKind: { type: string, enum: [codex-app-server, async-runner] }
        bindingStatus: { type: string, enum: [active, superseded, released, stale] }
        externalSessionId: { oneOf: [{ type: string }, { type: "null" }] }
        externalRunId: { oneOf: [{ type: string }, { type: "null" }] }
        externalThreadId: { oneOf: [{ type: string }, { type: "null" }] }
        runId: { oneOf: [{ type: string }, { type: "null" }] }
        runRevision: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
        turnId: { oneOf: [{ type: string }, { type: "null" }] }
        runStatus: { oneOf: [{ type: string, enum: [starting, running, waiting-approval, completed, failed, interrupted, stale] }, { type: "null" }] }
      required: [bindingId, runtimeKind, bindingStatus, externalSessionId, externalRunId, externalThreadId, runId, runRevision, turnId, runStatus]
    OperationalActivityEvent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        activityId: { type: string }
        source: { type: string, enum: [runtime, job-control] }
        sequence: { type: integer, minimum: 1 }
        kind: { type: string, enum: [run-started, run-completed, run-failed, run-interrupted, job-paused, job-resumed, job-terminated, step-started, step-completed, approval-required, approval-resolved, approval-rejected, warning, error, activity] }
        category: { type: string, enum: [lifecycle, approval, item, warning, error, other, control] }
        approvalKind: { oneOf: [{ type: string, enum: [command-execution, file-change, permissions, unsupported] }, { type: "null" }] }
        itemType: { oneOf: [{ type: string, maxLength: 80 }, { type: "null" }] }
        code: { oneOf: [{ type: string, maxLength: 80 }, { type: "null" }] }
        controlAction: { oneOf: [{ type: string, enum: [pause, resume, terminate] }, { type: "null" }] }
        resultingState: { oneOf: [{ type: string, enum: [running, paused, terminated, completed, failed] }, { type: "null" }] }
        processRevision: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
        createdAt: { type: string }
      required: [id, activityId, source, sequence, kind, category, approvalKind, itemType, code, controlAction, resultingState, processRevision, createdAt]
    OperationalActivity:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        kind: { type: string, enum: [agent-session, job] }
        scope: { type: string, enum: [workspace, repo, host] }
        status: { type: string, enum: [queued, idle, running, waiting-approval, paused, handoff-ready, completed, failed, interrupted, terminated, stale] }
        title: { type: string }
        targetDeviceId: { type: string, const: local-device }
        projectId: { oneOf: [{ type: string }, { type: "null" }] }
        workspaceId: { oneOf: [{ type: string }, { type: "null" }] }
        taskId: { oneOf: [{ type: string }, { type: "null" }] }
        repoId: { oneOf: [{ type: string }, { type: "null" }] }
        agentSessionId: { oneOf: [{ type: string }, { type: "null" }] }
        authorizationGrantId: { oneOf: [{ type: string }, { type: "null" }] }
        traceId: { oneOf: [{ type: string }, { type: "null" }] }
        workerInstanceId: { oneOf: [{ type: string }, { type: "null" }] }
        runtime: { oneOf: [{ $ref: '#/components/schemas/OperationalActivityRuntime' }, { type: "null" }] }
        job:
          oneOf:
            - type: object
              additionalProperties: false
              properties:
                id: { type: string }
                type: { type: string, enum: [pack, taskpack, codex-run] }
                status: { type: string, enum: [queued, running, completed, failed] }
                processState: { oneOf: [{ type: string, enum: [running, paused, terminated, completed, failed] }, { type: "null" }] }
                processLabel: { oneOf: [{ type: string }, { type: "null" }] }
                processRevision: { oneOf: [{ type: integer, minimum: 1 }, { type: "null" }] }
              required: [id, type, status, processState, processLabel, processRevision]
            - type: "null"
        directProcessSummary:
          type: object
          additionalProperties: false
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
          required: [total, active, running]
        latestEvent:
          oneOf:
            - $ref: '#/components/schemas/OperationalActivityEvent'
            - type: "null"
        controls:
          type: object
          additionalProperties: false
          properties:
            pause: { type: boolean }
            resume: { type: boolean }
            terminate: { type: boolean }
            interrupt: { type: boolean }
            hold: { type: boolean, const: false }
          required: [pause, resume, terminate, interrupt, hold]
        startedAt: { type: string }
        updatedAt: { type: string }
        endedAt: { oneOf: [{ type: string }, { type: "null" }] }
      required: [id, kind, scope, status, title, targetDeviceId, projectId, workspaceId, taskId, repoId, agentSessionId, authorizationGrantId, traceId, workerInstanceId, runtime, job, directProcessSummary, latestEvent, controls, startedAt, updatedAt, endedAt]
    OperationalActivityTimelineResponse:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean, enum: [true] }
        activityId: { type: string }
        events:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OperationalActivityEvent' }
      required: [ok, activityId, events]
    OperationalActivityListResponse:
      type: object
      additionalProperties: false
      properties:
        ok: { type: boolean, enum: [true] }
        activities:
          type: array
          items: { $ref: '#/components/schemas/OperationalActivity' }
        counts:
          type: object
          additionalProperties: false
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            waitingApproval: { type: integer, minimum: 0 }
            paused: { type: integer, minimum: 0 }
          required: [total, active, running, waitingApproval, paused]
      required: [ok, activities, counts]
    GitCommitSummary:
      type: object
      additionalProperties: false
      properties:
        hash:
          type: string
        shortHash:
          type: string
        subject:
          type: string
        committedAt:
          type: string
      required: [hash, shortHash, subject, committedAt]
    ChatDirectExecutionMetadata:
      type: object
      additionalProperties: false
      properties:
        lane:
          type: string
          const: chat-direct
        modelLoopOwner:
          type: string
          const: chatgpt
        executionScope:
          type: string
          enum: [workspace, host]
        executor:
          type: string
          description: Selected Direct Drive executor id. Current built-in ids include builtin-direct and codex-app-server-standalone; future downstream MCP executor ids remain dynamic.
        selectionMode:
          type: string
          enum: [automatic, explicit]
        operationId:
          type: string
        changedPaths:
          type: array
          items:
            type: string
        evidenceBundleId:
          oneOf:
            - type: string
            - type: "null"
        fallbackReason:
          type: string
      required: [lane, modelLoopOwner, executionScope, executor, selectionMode, operationId, changedPaths, evidenceBundleId]
    RecentCommitsResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        repoId:
          type: string
        commits:
          type: array
          items:
            $ref: '#/components/schemas/GitCommitSummary'
        execution:
          $ref: '#/components/schemas/ChatDirectExecutionMetadata'
      required: [ok, repoId, commits, execution]
    PackJobPayload:
      type: object
      additionalProperties: false
      properties:
        repoId:
          type: string
          description: Public repository alias resolved to a private local path by the operator. Defaults to primary in the current single-repo local-first setup.
    TaskPackJobPayload:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        problem:
          type: string
        contextSummary:
          type: string
        mustInspect:
          type: array
          items:
            type: string
        mayInspect:
          type: array
          items:
            type: string
        mustNotModify:
          type: array
          items:
            type: string
        verificationCommands:
          type: array
          items:
            type: string
        acceptanceCriteria:
          type: array
          items:
            type: string
      required: [title, problem]
    CodexRunJobPayload:
      type: object
      additionalProperties: false
      properties:
        repoId:
          type: string
          description: Public repository alias resolved by the local allowlist. Defaults to primary.
        title:
          type: string
        instructions:
          type: string
          description: Task instructions passed to local Codex CLI.
        executionMode:
          type: string
          enum: [plan, review, develop]
          default: develop
          description: plan runs read-only planning and writes artifacts only; review skips the main exec step and reviews current changes; develop may modify the execution repo according to sandbox and worktree policy.
        worktreePolicy:
          type: string
          enum: [auto, always, never]
          default: auto
        branchName:
          type: string
        approvalPolicy:
          type: string
          enum: [untrusted, on-request, never]
          default: never
        sandbox:
          type: string
          enum: [read-only, workspace-write, danger-full-access]
          default: workspace-write
          description: Effective sandbox is forced to read-only for plan and review. develop defaults to workspace-write unless overridden.
        verificationCommands:
          type: array
          items:
            type: string
        acceptanceCriteria:
          type: array
          items:
            type: string
        commitPolicy:
          type: string
          enum: [none, propose, commit]
          default: propose
        commitTitle:
          type: string
        commitBody:
          type: string
      required: [title, instructions]
    PackJobRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique job id
        type:
          type: string
          enum: [pack]
        status:
          type: string
          enum: [queued, running, completed, failed]
        createdAt:
          type: string
        updatedAt:
          type: string
        payload:
          $ref: '#/components/schemas/PackJobPayload'
        result:
          oneOf:
            - $ref: '#/components/schemas/PackJobResult'
            - type: 'null'
        error:
          type: string
      required: [id, type, status, createdAt, updatedAt, payload]
    TaskPackJobRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique job id
        type:
          type: string
          enum: [taskpack]
        status:
          type: string
          enum: [queued, running, completed, failed]
        createdAt:
          type: string
        updatedAt:
          type: string
        payload:
          $ref: '#/components/schemas/TaskPackJobPublicPayload'
        result:
          oneOf:
            - $ref: '#/components/schemas/TaskPackJobResult'
            - type: 'null'
        error:
          type: string
      required: [id, type, status, createdAt, updatedAt, payload]
    CodexRunJobRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique job id
        type:
          type: string
          enum: [codex-run]
        status:
          type: string
          enum: [queued, running, completed, failed]
        createdAt:
          type: string
        updatedAt:
          type: string
        payload:
          $ref: '#/components/schemas/CodexRunJobPublicPayload'
        result:
          oneOf:
            - $ref: '#/components/schemas/CodexRunJobResult'
            - type: 'null'
        error:
          type: string
      required: [id, type, status, createdAt, updatedAt, payload]
    PackJobResult:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
        repoId:
          type: string
        repoName:
          type: string
        repomixXmlPath:
          type: string
        promptPath:
          type: string
        summaryPath:
          type: string
        manifestPath:
          type: string
        publicIncludeEntries:
          type: array
          items:
            type: string
      required:
        [createdAt, repoId, repoName, repomixXmlPath, promptPath, summaryPath, manifestPath, publicIncludeEntries]
    TaskPackJobPublicPayload:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
      required: [title]
    CodexRunJobPublicPayload:
      type: object
      additionalProperties: false
      properties:
        repoId:
          type: string
        title:
          type: string
        executionMode:
          type: string
          enum: [plan, review, develop]
        worktreePolicy:
          type: string
          enum: [auto, always, never]
        commitPolicy:
          type: string
          enum: [none, propose, commit]
      required: [repoId, title]
    TaskPackJobResult:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
        title:
          type: string
        markdownPath:
          type: string
        jsonPath:
          type: string
      required: [createdAt, title, markdownPath, jsonPath]
    CodexRunCommitResult:
      type: object
      additionalProperties: false
      properties:
        committed:
          type: boolean
        commitHash:
          type: string
        commitMessage:
          type: string
        error:
          type: string
      required: [committed]
    CodexRunJobResult:
      type: object
      additionalProperties: false
      properties:
        createdAt:
          type: string
        repoId:
          type: string
        title:
          type: string
        executionMode:
          type: string
          enum: [plan, review, develop]
        worktreePolicy:
          type: string
          enum: [auto, always, never]
        worktreeCreated:
          type: boolean
        branchName:
          type: string
        statusSummary:
          type: string
        codexExitCode:
          type: integer
        reviewExitCode:
          type: integer
        gitStatus:
          type: string
        hasDiff:
          type: boolean
        commit:
          $ref: '#/components/schemas/CodexRunCommitResult'
        promptPath:
          type: string
        stdoutPath:
          type: string
        stderrPath:
          type: string
        diffPath:
          type: string
        reviewPath:
          type: string
        summaryPath:
          type: string
      required:
        [createdAt, repoId, title, executionMode, worktreePolicy, worktreeCreated, statusSummary, codexExitCode, reviewExitCode, gitStatus, hasDiff, commit, promptPath, stdoutPath, stderrPath, diffPath, reviewPath, summaryPath]
    HostDirectRoot:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        displayName:
          type: string
        access:
          type: array
          items:
            type: string
            enum: [read, write]
      required: [id, displayName, access]
    HostDirectRootsResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        executionScope:
          type: string
          const: host
        mode:
          type: string
          enum: [read-only, mutation-enabled]
        roots:
          type: array
          items:
            $ref: '#/components/schemas/HostDirectRoot'
      required: [ok, executionScope, mode, roots]
    HostFileReadPayload:
      type: object
      additionalProperties: false
      properties:
        rootId:
          type: string
          description: Public-safe Host Direct root alias. This is not a local absolute path.
        path:
          type: string
          description: Relative text-like file path inside the selected Host Direct root. Absolute paths are rejected.
        executorId:
          type: string
          description: Optional explicit Host Direct executor id. Explicit selection never silently falls back to another executor.
      required: [rootId, path]
    HostFileReadResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
        rootId:
          type: string
        file:
          $ref: '#/components/schemas/FileReadResult'
        execution:
          $ref: '#/components/schemas/ChatDirectExecutionMetadata'
      required: [ok, rootId, file, execution]
    HostMutationWritePayload:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          const: files.write
        rootId:
          type: string
        path:
          type: string
          description: Relative text-like path inside the selected Host Root alias. Absolute paths are rejected.
        content:
          type: string
          maxLength: 65536
        sessionId:
          type: string
          description: Required when the canonical target re-enters a registered Workspace.
        executorId:
          type: string
          description: Optional explicit executor. Execution is pinned to the executor stored on the approval.
      required: [operation, rootId, path, content]
