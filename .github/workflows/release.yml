name: ChatCockpit Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  source-package:
    name: Build source package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build curated source package
        run: ./scripts/create-release-source-package.sh "${{ inputs.version }}"

      - name: Verify source release package
        run: npm run verify:release

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ChatCockpit-source-v${{ inputs.version }}
          path: |
            dist/release/ChatCockpit-source-v${{ inputs.version }}.tar.gz
            dist/release/ChatCockpit-source-v${{ inputs.version }}.tar.gz.sha256
