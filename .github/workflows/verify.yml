name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Full verification (Node ${{ matrix.node-version }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.13.0"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check whitespace
        run: git diff --check

      - name: Verify current tree
        run: npm run verify

      - name: Verify ChatGPT MCP OAuth lifecycle
        run: npm run verify:oauth-flow

      - name: Verify source archive
        run: npm run verify:source-archive

      - name: Scan Git history for privacy leaks
        run: npm run privacy:scan:history

  macos-desktop:
    name: macOS desktop package
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop contract
        run: npm run verify:macos-desktop

      - name: Test Swift package
        run: swift test --package-path desktop/macos

      - name: Build unsigned local app
        run: npm run build:macos-desktop

  release-dry-run:
    name: Release dry-run
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source release package
        run: npm run verify:release

      - name: Build curated source package
        run: npm run release:source
